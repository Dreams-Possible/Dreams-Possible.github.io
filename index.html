<body data-page="home">
  <div class="ambient-world" aria-hidden="true">
    <div class="fog-layer fog-cyan"></div><div class="fog-layer fog-secondary"></div>
    <canvas class="weather-canvas" aria-hidden="true"></canvas>
    <div class="space-scene" aria-hidden="true">
      <div class="scene-grid"></div>
      <div class="scene-halo"></div>
      <div class="scene-frame frame-far"></div>
      <div class="scene-frame frame-mid"></div>
      <div class="scene-frame frame-near"></div>
      <div class="scene-trace trace-one"></div><div class="scene-trace trace-two"></div>
      <span class="scene-point point-one"></span><span class="scene-point point-two"></span><span class="scene-point point-three"></span>
    </div>
  </div>
  <a class="skip-link" href="#main" data-i18n="skip">跳到正文</a>
  <header class="site-header glass-surface">
    <div class="shell header-inner">
      <a class="wordmark" href="index.html" aria-label="Mathrix 首页" data-i18n-aria="homeAria">Mathrix<span aria-hidden="true">.</span></a>
      <nav class="main-nav" aria-label="主导航" data-i18n-aria="navLabel">
        <a href="index.html" aria-current="page" data-i18n="navHome">首页</a>
        <a href="projects.html" data-i18n="navProjects">全部项目</a>
        <a href="https://github.com/Dreams-Possible" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </nav>
      <div class="preferences"><div class="preference-item"><label for="language-select">Language</label><select id="language-select" class="preference-select" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></div><div class="preference-item"><label for="theme-select">Theme</label><select id="theme-select" class="preference-select theme-select" aria-label="Theme"><option value="auto" data-i18n="themeAuto">跟随系统</option><option value="light" data-i18n="themeLight">浅色</option><option value="dark" data-i18n="themeDark">深色</option></select></div></div>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="hero">
      <div class="hero-stage">
      <div class="shell hero-layout">
        <div class="hero-copy">
          <p class="section-index" data-i18n="heroIndex">工程实验 / 持续记录</p>
          <h1 class="hero-title"><span data-i18n="heroTitleLine1">把想法放进</span><br><span data-i18n="heroTitleLine2">真实世界。</span></h1>
          <p class="hero-intro" data-i18n="heroIntro">从嵌入式界面到空间交互，从传感器与控制到系统改造。这里记录项目如何从问题走向可运行的答案。</p>
          <div class="hero-actions"><a class="primary-action glass-surface" href="projects.html"><span data-i18n="heroAction">探索全部项目</span><span aria-hidden="true">↗</span></a><a class="secondary-action" href="https://github.com/Dreams-Possible" target="_blank" rel="noopener noreferrer" data-i18n="githubAction">在 GitHub 查看源码</a></div>
        </div>

      </div>
      <div class="shell scroll-hint"><span data-i18n="scrollHint">向下探索</span><span aria-hidden="true">↓</span></div>
      </div>
    </section>

    <section class="discovery" aria-labelledby="discovery-heading">
      <div class="shell">
        <div class="section-heading">
          <div><div class="settled-title-slot" aria-hidden="true"><h1 class="hero-title settled-title"><span data-i18n="heroTitleLine1">把想法放进</span><br><span data-i18n="heroTitleLine2">真实世界。</span></h1></div><p class="section-index" data-i18n="discoveryIndex">随机漫游</p><h2 id="discovery-heading" data-i18n="discoveryTitle">这次，从这里开始。</h2><p data-i18n="discoveryIntro">六个随机项目，每次到访都可能遇见不同的方向。</p></div>
          <button class="shuffle-action glass-surface" id="shuffle" type="button"><span data-i18n="shuffle">换一组</span><span aria-hidden="true">⟳</span></button>
        </div>
        <div id="featured-projects" class="feature-grid"></div><span id="shuffle-status" class="sr-only" role="status" aria-live="polite"></span>
        <noscript><p class="no-script">项目列表需要 JavaScript。你仍可在 <a href="https://github.com/Dreams-Possible?tab=repositories">GitHub 仓库列表</a>浏览全部项目。</p></noscript>
        <a class="archive-action glass-surface" href="projects.html"><span class="archive-action-copy"><small data-i18n="archiveEyebrow">继续探索</small><strong data-i18n="archiveTitle">查看全部项目</strong><span data-i18n="archiveDescription">按时间或领域浏览完整项目档案</span></span><span class="archive-action-count"><span id="project-count">46</span><small data-i18n="projectUnit">个项目</small></span><span class="archive-arrow" aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <details class="atmosphere-tuner"><summary class="glass-surface" data-i18n="atmosphere">氛围</summary><div class="atmosphere-panel glass-surface"><label class="toggle-control"><span data-i18n="fogControl">雾气</span><input id="fog-enabled" type="checkbox" role="switch" checked></label><label class="toggle-control"><span data-i18n="rainToggle">雨滴</span><input id="rain-enabled" type="checkbox" role="switch" checked></label><label><span data-i18n="rainControl">雨量</span><input id="rain-density" type="range" min="0" max="100" value="50"><output id="rain-value" for="rain-density">50%</output></label><label class="toggle-control"><span data-i18n="meteorToggle">流星</span><input id="meteors-enabled" type="checkbox" role="switch" checked></label><label><span data-i18n="meteorControl">流星频率</span><input id="meteor-rate" type="range" min="0" max="100" value="50"><output id="meteor-value" for="meteor-rate">50%</output></label><label class="toggle-control"><span data-i18n="pointerControl">指针光场</span><input id="pointer-enabled" type="checkbox" role="switch" checked></label><label class="toggle-control"><span data-i18n="narrativeControl">滚动叙事</span><input id="narrative-enabled" type="checkbox" role="switch" checked></label><button class="atmosphere-reset" id="reset-atmosphere" type="button" data-i18n="resetAtmosphere">恢复默认</button></div></details>
  <footer class="site-footer glass-surface"><div class="shell footer-inner"><span>© <span id="year"></span> Mathrix</span><span><span data-i18n="footerSource">源码与记录</span> <a href="https://github.com/Dreams-Possible">Dreams-Possible ↗</a></span></div></footer>
