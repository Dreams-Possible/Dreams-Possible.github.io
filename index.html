<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Mathrix 的个人博客：嵌入式、系统、机器人与交互项目。"
    />
    <meta property="og:title" content="Mathrix — 项目与笔记" />
    <meta
      property="og:description"
      content="浏览 Mathrix 的工程实验与开源项目。"
    />
    <title>Mathrix — 项目与笔记</title>
    <script src="assets/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="assets/js/main.js"></script>
  </head>
  <body data-page="home">
    <div class="ambient-world" aria-hidden="true">
      <div class="fog-layer fog-cyan"></div>
      <div class="fog-layer fog-secondary"></div>
      <canvas class="weather-canvas" aria-hidden="true"></canvas>
      <div class="space-scene" aria-hidden="true">
        <div class="scene-grid"></div>
        <div class="scene-halo"></div>
        <div class="scene-frame frame-far"></div>
        <div class="scene-frame frame-mid"></div>
        <div class="scene-frame frame-near"></div>
        <div class="scene-trace trace-one"></div>
        <div class="scene-trace trace-two"></div>
        <span class="scene-point point-one"></span
        ><span class="scene-point point-two"></span
        ><span class="scene-point point-three"></span>
      </div>
    </div>
    <a class="skip-link" href="#main" data-i18n="skip"></a>
    <header class="site-header glass-surface">
      <div class="shell header-inner">
        <a class="wordmark" href="index.html" data-i18n-aria="homeAria"
          ><span data-i18n="brandName"></span
          ><span aria-hidden="true">.</span></a
        >
        <nav class="main-nav" data-i18n-aria="navLabel">
          <a href="index.html" aria-current="page" data-i18n="navHome"></a>
          <a href="projects.html" data-i18n="navProjects"></a>
          <a
            href="https://github.com/Dreams-Possible"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="githubLink"
          ></a>
        </nav>
        <div class="preferences">
          <div class="preference-item">
            <label for="language-select" data-i18n="languageLabel"></label>
            <select
              id="language-select"
              class="preference-select"
              data-i18n-aria="languageLabel"
            >
              <option value="zh" data-i18n="languageChinese"></option>
              <option value="en" data-i18n="languageEnglish"></option>
            </select>
          </div>
          <div class="preference-item">
            <label for="theme-select" data-i18n="themeLabel"></label>
            <select
              id="theme-select"
              class="preference-select theme-select"
              data-i18n-aria="themeLabel"
            >
              <option value="auto" data-i18n="themeAuto"></option>
              <option value="light" data-i18n="themeLight"></option>
              <option value="dark" data-i18n="themeDark"></option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="hero" id="hero">
        <div class="hero-stage">
          <div class="shell hero-layout">
            <div class="hero-copy">
              <p class="section-index" data-i18n="heroIndex"></p>
              <h1 class="hero-title">
                <span data-i18n="heroTitleLine1"></span><br /><span
                  data-i18n="heroTitleLine2"
                ></span>
              </h1>
              <p class="hero-intro" data-i18n="heroIntro"></p>
              <div class="hero-actions">
                <a class="primary-action glass-surface" href="projects.html"
                  ><span data-i18n="heroAction"></span
                  ><span aria-hidden="true">↗</span></a
                ><a
                  class="secondary-action"
                  href="https://github.com/Dreams-Possible"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-i18n="githubAction"
                ></a>
              </div>
            </div>
          </div>
          <div class="shell scroll-hint">
            <span data-i18n="scrollHint"></span
            ><span aria-hidden="true">↓</span>
          </div>
        </div>
      </section>

      <section class="discovery" aria-labelledby="discovery-heading">
        <div class="shell">
          <div class="section-heading">
            <div>
              <div class="settled-title-slot" aria-hidden="true">
                <h1 class="hero-title settled-title">
                  <span data-i18n="heroTitleLine1"></span><br /><span
                    data-i18n="heroTitleLine2"
                  ></span>
                </h1>
              </div>
              <p class="section-index" data-i18n="discoveryIndex"></p>
              <h2 id="discovery-heading" data-i18n="discoveryTitle"></h2>
              <p data-i18n="discoveryIntro"></p>
            </div>
            <button
              class="shuffle-action glass-surface"
              id="shuffle"
              type="button"
            >
              <span data-i18n="shuffle"></span><span aria-hidden="true">⟳</span>
            </button>
          </div>
          <div id="featured-projects" class="feature-grid"></div>
          <span
            id="shuffle-status"
            class="sr-only"
            role="status"
            aria-live="polite"
          ></span>
          <noscript>
            <p class="no-script">
              项目列表需要 JavaScript。你仍可在
              <a href="https://github.com/Dreams-Possible?tab=repositories"
                >GitHub 仓库列表</a
              >浏览全部项目。
            </p>
          </noscript>
          <a class="archive-action glass-surface" href="projects.html"
            ><span class="archive-action-copy"
              ><small data-i18n="archiveEyebrow"></small
              ><strong data-i18n="archiveTitle"></strong
              ><span data-i18n="archiveDescription"></span></span
            ><span class="archive-action-count"
              ><span id="project-count"></span
              ><small data-i18n="projectUnit"></small></span
            ><span class="archive-arrow" aria-hidden="true">↗</span></a
          >
        </div>
      </section>
    </main>

    <details class="atmosphere-tuner">
      <summary class="glass-surface">
        <span data-i18n="atmosphere"></span>
      </summary>
      <div class="atmosphere-panel glass-surface">
        <label class="toggle-control"
          ><span data-i18n="fogControl"></span
          ><input id="fog-enabled" type="checkbox" role="switch" checked
        /></label>
        <label class="toggle-control"
          ><span data-i18n="rainToggle"></span
          ><input id="rain-enabled" type="checkbox" role="switch" checked
        /></label>
        <label
          ><span data-i18n="rainControl"></span
          ><input
            id="rain-density"
            type="range"
            min="0"
            max="100"
            value="50" /><output id="rain-value" for="rain-density"></output
        ></label>
        <label class="toggle-control"
          ><span data-i18n="meteorToggle"></span
          ><input id="meteors-enabled" type="checkbox" role="switch" checked
        /></label>
        <label
          ><span data-i18n="meteorControl"></span
          ><input
            id="meteor-rate"
            type="range"
            min="0"
            max="100"
            value="50" /><output id="meteor-value" for="meteor-rate"></output
        ></label>
        <label class="toggle-control"
          ><span data-i18n="pointerControl"></span
          ><input id="pointer-enabled" type="checkbox" role="switch" checked
        /></label>
        <label class="toggle-control"
          ><span data-i18n="sceneMotionControl"></span
          ><input
            id="scene-motion-enabled"
            type="checkbox"
            role="switch"
            checked
        /></label>
        <label class="toggle-control"
          ><span data-i18n="narrativeControl"></span
          ><input id="narrative-enabled" type="checkbox" role="switch" checked
        /></label>
        <button
          class="atmosphere-reset"
          id="reset-atmosphere"
          type="button"
          data-i18n="resetAtmosphere"
        ></button>
      </div>
    </details>
    <footer class="site-footer glass-surface">
      <div class="shell footer-inner">
        <span
          >© <span id="year"></span> <span data-i18n="brandName"></span></span
        ><span
          ><span data-i18n="footerSource"></span>
          <a
            href="https://github.com/Dreams-Possible"
            data-i18n="githubAccount"
          ></a
        ></span>
      </div>
    </footer>
  </body>
</html>
